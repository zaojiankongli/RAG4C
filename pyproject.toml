[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag4c"
version = "0.1.0"
description = "Enterprise RAG foundation: pydantic-settings config, core data models, Milvus client (Milvus Lite + server), BGE-M3 embedding, BGE-reranker-v2-M3 rerank, OpenAI-compatible LLM slots."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.13,<2",
    "numpy>=1.24",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
# 向量库：Milvus server 模式（推荐安装 milvus-lite extra 以获得本地 .db 文件模式）
milvus = ["pymilvus>=3.0.0,<4"]
# 本地零部署模式：Milvus Lite（通过本地 .db 文件启动，开箱即用）
milvus-lite = ["pymilvus[milvus-lite]>=3.0.0,<4"]
# 本地嵌入 / 重排序模型（FlagEmbedding 会拉取 BGE 系列模型权重）
embedding = ["FlagEmbedding>=1.2.10"]
llm = ["openai>=1.40"]
identity = ["dnspython>=2.6,<3", "cryptography>=42,<47", "authlib>=1.3,<2", "httpx>=0.27,<1"]
torch = ["torch>=2.1"]
# 编排：LangGraph 状态机（rag.py 顶层编排器）
graph = ["langgraph>=0.2"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# 加速件（可选）：答案 L2 缓存、跨进程 single-flight、语料代次、Streams 排队。
# 刻意不放进 server 的依赖里——core/redis_client.py 的每个出口在连不上时都
# 返回 None/False，不装这个包服务照常起、照常答，只是缓存退回进程内 LRU、
# 排队退回 asyncio.Semaphore。把它列为必需依赖等于否认这套降级设计。
redis = ["redis>=5,<7"]
# 目录库驱动：PostgreSQL（推荐）/ MySQL。两个都是可选依赖——不装也能跑 SQLite，
# 装哪个取决于 CATALOG_DB_URL 的方言。psycopg2-binary 免编译，Windows 上也能装。
postgres = ["psycopg2-binary>=2.9,<3"]
mysql = ["pymysql>=1.1,<2"]
dev = ["httpx2>=0.28", "pytest>=8", "pytest-xdist>=3.6,<4", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["rag", "rag_common", "rag_graph", "rag_stream"]

[tool.setuptools.packages.find]
include = [
    "config*",
    "core*",
    "eval*",
    "generation*",
    "indexing*",
    "models*",
    "prompts*",
    "retrieval*",
    "server*",
    "verify*",
]

[tool.setuptools.package-data]
config = ["*.env.example"]
prompts = ["*.txt", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 刻意不把 -n auto 写进 addopts：并行是可选加速，不是必需品——没装 xdist 也必须串行跑通。
# 需要并行时显式 `pytest -n auto` 或 `scripts/verify_all.ps1 -Parallel`。
#
# ⚠️ 并行与【性能预算断言】互斥：tests 里有一批断言 p95 延迟 / offer 热路径预算 /
# 1000 事件与 100000 列表墙钟的用例（test_run_history_store、test_run_registry、
# test_run_ops_api、test_run_observability_parity、test_source_dispatch_runtime）。
# 并行跑时它们会被同机邻居抢 CPU 打穿，实测 -n auto 转红 12 个、-n 4 转红 10 个，
# 而串行时全绿。所以这些用例必须在**独占机器**上串行跑。
# （曾经这里声明过一个 `serial` marker 并声称 xdist 会把它派到专用 worker——那是错的，
#   xdist 没有这个内建机制，留着只会误导人以为并行是安全的。已删除。）

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".testdata",
    "archify",
    "archify-install-check-v2.15.0",
    "frontend",
    "langchain4j-sister-project",
    "repo-snapshot",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_*.py" = ["E402"]
