  <title id="cs-title">Four-leaf clover sprig</title>
  <desc id="cs-desc">Four distinct heart-shaped green leaflets meet at one petiole. Each has a natural cleft, branching veins, a pale crescent marking and restrained cel shading. A slender curved stem completes the transparent botanical motif.</desc>
