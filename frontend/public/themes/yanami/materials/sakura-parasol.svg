  <title id="sp-title">Sakura paper parasol</title>
  <desc id="sp-desc">A tilted blush-pink traditional paper parasol seen from below. Twenty-four individually drawn bamboo ribs, fine intermediate stays, a laced support ring, brass-capped central hub, diagonal bamboo handle and a silk tassel remain crisp at small sizes. Transparent background.</desc>
