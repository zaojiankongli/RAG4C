  <title id="sb-title">Sakura on an arching branch</title>
  <desc id="sb-desc">Seven delicate five-petaled cherry blossoms with cleft tips, fine rose veins and golden stamens. Pink buds and a few young green leaves follow a tapering curved branch on a transparent background.</desc>
