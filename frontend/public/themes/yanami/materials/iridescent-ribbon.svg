  <title id="ir-title">Iridescent flowing ribbon</title>
  <desc id="ir-desc">One airy satin ribbon turns from powder blue through rose to pale cyan, with a looped left end, indigo reverse folds, and fine pearly hems. Transparent divider with generous open space.</desc>
