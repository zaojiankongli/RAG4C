[package]
name = "rag4c-console"
version = "0.1.0"
description = "RAG4C 企业级 RAG 系统桌面问答控制台"
authors = ["RAG4C"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rag4c_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
