services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /usr/local/service/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: always
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - zjkl

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - /usr/local/service/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - zjkl

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      ETCD_AUTH_ENABLED: "false"
      MINIO_ADDRESS: minio:9000
    volumes:
      - /usr/local/service/milvus/milvus:/var/lib/milvus
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - zjkl

  rabbitmq:
    image: rabbitmq:4.3.0-management
    container_name: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root1234
    volumes:
      - /usr/local/service/rabbitmq/data:/var/lib/rabbitmq
      - /usr/local/service/rabbitmq/logs:/var/log/rabbitmq
    restart: unless-stopped
    networks:
      - zjkl

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - /usr/local/service/redis/conf:/usr/local/etc/redis
      - /usr/local/service/redis/data:/data
    restart: unless-stopped
    networks:
      - zjkl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: redis-server /usr/local/etc/redis/redis.conf

  postgres:
    image: postgres:17.8-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: zjkl
      POSTGRES_PASSWORD: root1234
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - /usr/local/service/postgres/data:/var/lib/postgresql/data
      - /usr/local/service/postgres/init:/docker-entrypoint-initdb.d:ro
      - /usr/local/service/postgres/conf:/etc/postgresql/conf.d:ro
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d zjkl -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - zjkl

networks:
  zjkl:
    driver: bridge
